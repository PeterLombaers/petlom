[project]
name = "petlom"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.5",
    "sqlmodel>=0.0.22",
    "bcrypt>=5.0.0",
    "PyJWT>=2.8.0",
    "pydantic-settings>=2.14.0",
    "httpx>=0.27.2",
]

[tool.setuptools]
packages = ["backend"]

[dependency-groups]
dev = [
    "beautifulsoup4>=4.14.3",
    "factory-boy>=3.3.1",
    "pytest>=8.3.3",
    "pytest-env>=1.6.0",
    "requests>=2.33.1",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
markers = [
    "external: hits the real external rating API (run with --external or EXTERNAL_TESTS=true)",
    "slow: takes more than a few seconds (skip with -m 'not slow')",
]
env = [
    "JWT_SECRET_KEY=test-secret-key-not-for-production",
    'ALLOWED_ORIGINS=["http://localhost:5173","http://127.0.0.1:5173"]',
]
