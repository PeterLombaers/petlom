# Alembic configuration. See migrations/README for the workflow.
#
# There is deliberately no sqlalchemy.url here: migrations/env.py builds the URL
# from backend.config.settings.database_fp, so the CLI, the app and the tests all
# point at the same database without a second place to keep in sync.

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

# Filenames sort chronologically, which is what you want when reading versions/.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
